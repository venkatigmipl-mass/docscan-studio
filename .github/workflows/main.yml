name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and build web app
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
      -       - name: Add Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps --no-audit --no-fund
          rm -f capacitor.config.ts
          echo '{"appId":"com.docscan.studio","appName":"DocScan Studio","webDir":"dist"}' > capacitor.config.json
          [ -d android ] || npx cap add android
      - name: Add camera permission
        run: |
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml || \
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - name: Sync and build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DocScanStudio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
